name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked tox -e lint,types

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked tox -e tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked tox -e browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: test-results/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked tox -e docs
      # the publishing job deploys this site rather than building it again,
      # so what reaches the pages is what was checked
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
          if-no-files-found: error
          retention-days: 7

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: ls -l dist
      - name: Render a diagram with the installed wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'EOF'
          import markdown
          import markdown_d2

          fence = {"name": "d2", "class": "d2", "format": markdown_d2.formatter(cache_dir=None), "validator": markdown_d2.validator}
          md = markdown.Markdown(extensions=["pymdownx.superfences"], extension_configs={"pymdownx.superfences": {"custom_fences": [fence]}})
          html = md.convert("```d2\na -> b\n```")
          assert "<svg" in html and "<script data-markdown-d2>" in html, html
          EOF

  dist:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check the release tag and pre-release flag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.ZrcN"; exit 1
          fi
          case "$TAG" in
            *rc*) [ "$PRERELEASE" = "true" ] || { echo "::error::$TAG must be marked pre-release"; exit 1; } ;;
            *)    [ "$PRERELEASE" = "false" ] || { echo "::error::$TAG must not be marked pre-release"; exit 1; } ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check the version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test -f "dist/markdown_d2-${TAG#v}.tar.gz"
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # publishing runs in its own job, after every check has passed, so the
  # permission to upload to PyPI never sits in a job that runs the build
  pypi:
    needs: [lint, tests, browser, docs, wheel, dist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markdown-d2
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # main and final releases only: a pre-release leaves the site describing the
  # last final release
  pages:
    needs: [lint, docs]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
