# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
]

# ruff and Biome run from uv.lock and package-lock.json rather than pinned hook
# repos, so the hooks, tox and CI all run the same versions
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --locked --only-group lint ruff check --fix --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --locked --only-group lint ruff format --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "biome"
name = "biome check"
language = "system"
entry = "uv run --locked python -m nodejs_wheel node_modules/@biomejs/biome/bin/biome check --write"
files = "\\.m?ts$"
require_serial = true
